<style>
  /* ---------- Renkler ve temel ölçüler ---------- */
  :root {
    --sea-900: #0E2136;
    --sea-800: #13293F;
    --navy: #1E3A5A;
    --navy-600: #2B4F75;
    --gold: #C9A25E;
    --gold-soft: #E5CD9C;
    --gold-ink: #8A6A2F;
    --mist: #F4F7F9;
    --white: #FFFFFF;
    --text: #34414E;
    --muted: #5D6A77;
    --line: #DCE3E9;
    --ease: cubic-bezier(.22, 1, .36, 1);
    --nav-h: 78px;
    --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

  body {
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.75;
    color: var(--text);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: clip;
  }
  .js.i18n-wait body { visibility: hidden; }

  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; }
  svg { flex-shrink: 0; }
  h1, h2, h3 {
    font-family: var(--serif);
    color: var(--navy);
    font-weight: 600;
    line-height: 1.22;
    text-wrap: balance;
  }
  p { text-wrap: pretty; }

  .skip-link {
    position: absolute; left: 16px; top: -64px; z-index: 2000;
    background: var(--navy); color: #fff; padding: 10px 16px;
    border-radius: 10px; text-decoration: none; transition: top .3s var(--ease);
  }
  .skip-link:focus { top: 12px; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .container { max-width: 1160px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); }
  .section { padding: clamp(84px, 11vw, 136px) 0; scroll-margin-top: 64px; }

  /* Bölüm başlığı: ortalı başlık ve altında ince altın çizgi (ilk tasarımdan korunan imza öğe) */
  .section-head { text-align: center; max-width: 720px; margin: 0 auto clamp(48px, 6vw, 72px); }
  .section-head h2 {
    position: relative; display: inline-block; padding-bottom: 18px;
    font-size: clamp(2rem, 1.45rem + 2.2vw, 2.75rem);
  }
  .section-head h2::after {
    content: ''; position: absolute; left: 50%; bottom: 0;
    width: 56px; height: 2px; background: var(--gold); transform: translateX(-50%);
    transition: width 1.2s var(--ease) .25s;
  }
  .js .section-head:not(.is-visible) h2::after { width: 0; }
  .lead { margin: 22px auto 0; max-width: 58ch; color: var(--muted); font-size: 1.05rem; }
  .intro { max-width: 700px; margin: 0 auto clamp(56px, 7vw, 76px); }
  .intro p { margin-bottom: 16px; }
  .intro .intro-note {
    display: inline-flex; align-items: center; gap: 12px; margin: 6px 0 0;
    padding: 12px 18px; border-radius: 14px; background: var(--white); box-shadow: 0 0 0 1px var(--line);
    color: var(--navy); font-weight: 500;
  }
  .intro-note .icon { width: 20px; height: 20px; color: var(--gold-ink); }

  /* ---------- Kaydırma ilerleme çizgisi ---------- */
  .progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 1001; pointer-events: none; }
  .progress span {
    display: block; height: 100%; transform-origin: left; transform: scaleX(0);
    background: linear-gradient(90deg, var(--gold), var(--gold-soft));
  }

  /* ---------- Üst menü ---------- */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    transition: background-color .5s var(--ease), box-shadow .5s var(--ease), backdrop-filter .5s var(--ease);
  }
  .nav-inner {
    max-width: 1240px; margin: 0 auto; height: var(--nav-h);
    padding: 0 clamp(16px, 4vw, 48px);
    display: flex; align-items: center; gap: 24px;
    transition: height .5s var(--ease);
  }
  .logo {
    margin-right: auto; white-space: nowrap;
    font-family: var(--serif); font-weight: 600; font-size: 1.4rem;
    color: #fff; text-decoration: none; transition: color .5s var(--ease);
  }
  .nav-links { display: flex; align-items: center; gap: clamp(18px, 2.4vw, 34px); }
  .nav-links a {
    position: relative; padding: 6px 0; white-space: nowrap;
    color: rgba(255, 255, 255, .88); font-weight: 500; font-size: .95rem; text-decoration: none;
    transition: color .5s var(--ease);
  }
  .nav-links a::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: var(--gold); transform: scaleX(0); transform-origin: left;
    transition: transform .5s var(--ease);
  }
  .nav-links a:hover::after, .nav-links a[aria-current="true"]::after, .nav-links a[aria-current="page"]::after { transform: scaleX(1); }
  .nav-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .navbar.scrolled, .navbar.menu-open {
    background: rgba(255, 255, 255, .93);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    backdrop-filter: saturate(1.4) blur(14px);
    box-shadow: 0 1px 0 rgba(30, 58, 90, .08), 0 12px 30px -20px rgba(19, 41, 63, .35);
  }
  .navbar.scrolled .nav-inner { height: 66px; }
  .navbar.scrolled .logo, .navbar.menu-open .logo { color: var(--navy); }
  .navbar.scrolled .nav-links a { color: var(--text); }

  /* ---------- Kaydırmalı dil anahtarı (TR / EN) ---------- */
  .lang-switch {
    position: relative; display: grid; grid-template-columns: 1fr 1fr; align-items: center;
    width: 80px; height: 36px; padding: 3px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .4); background: rgba(255, 255, 255, .1);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font: 600 .74rem/1 var(--sans); letter-spacing: .08em;
    cursor: pointer; touch-action: pan-y; -webkit-tap-highlight-color: transparent;
    transition: background-color .5s var(--ease), border-color .5s var(--ease);
  }
  .lang-switch:hover { border-color: rgba(255, 255, 255, .65); }
  .lang-switch__thumb {
    position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
    border-radius: 999px; background: var(--gold);
    box-shadow: 0 4px 12px -4px rgba(0, 0, 0, .35);
    transition: transform .55s cubic-bezier(.65, 0, .35, 1), background-color .5s var(--ease);
  }
  .lang-switch[aria-checked="true"] .lang-switch__thumb { transform: translateX(100%); }
  .lang-switch__opt {
    position: relative; z-index: 1; display: grid; place-items: center; height: 100%;
    color: rgba(255, 255, 255, .8); user-select: none; -webkit-user-select: none;
    transition: color .45s var(--ease);
  }
  .lang-switch[aria-checked="false"] [data-opt="tr"],
  .lang-switch[aria-checked="true"] [data-opt="en"] { color: var(--sea-900); }

  .navbar.scrolled .lang-switch, .navbar.menu-open .lang-switch {
    border-color: rgba(30, 58, 90, .2); background: rgba(30, 58, 90, .05);
  }
  .navbar.scrolled .lang-switch:hover, .navbar.menu-open .lang-switch:hover { border-color: rgba(30, 58, 90, .4); }
  .navbar.scrolled .lang-switch__thumb, .navbar.menu-open .lang-switch__thumb { background: var(--navy); }
  .navbar.scrolled .lang-switch__opt, .navbar.menu-open .lang-switch__opt { color: var(--muted); }
  .navbar.scrolled .lang-switch[aria-checked="false"] [data-opt="tr"],
  .navbar.scrolled .lang-switch[aria-checked="true"] [data-opt="en"],
  .navbar.menu-open .lang-switch[aria-checked="false"] [data-opt="tr"],
  .navbar.menu-open .lang-switch[aria-checked="true"] [data-opt="en"] { color: #fff; }

  /* ---------- Mobil menü ---------- */
  .menu-toggle {
    display: none; position: relative; width: 42px; height: 42px;
    border-radius: 12px; border: 1px solid rgba(255, 255, 255, .35);
    background: transparent; color: #fff; cursor: pointer;
    transition: color .5s var(--ease), border-color .5s var(--ease);
  }
  .menu-toggle span {
    position: absolute; left: 11px; right: 11px; height: 1.6px; border-radius: 2px;
    background: currentColor; transition: transform .45s var(--ease), opacity .3s var(--ease);
  }
  .menu-toggle span:nth-child(1) { top: 14px; }
  .menu-toggle span:nth-child(2) { top: 20px; }
  .menu-toggle span:nth-child(3) { top: 26px; }
  .menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .navbar.scrolled .menu-toggle, .navbar.menu-open .menu-toggle { color: var(--navy); border-color: rgba(30, 58, 90, .22); }

  .mobile-menu {
    position: absolute; top: 100%; left: 0; right: 0;
    display: flex; flex-direction: column;
    padding: 6px clamp(16px, 4vw, 48px) 18px;
    background: #fff; border-top: 1px solid var(--line);
    box-shadow: 0 26px 40px -26px rgba(19, 41, 63, .4);
    opacity: 0; visibility: hidden; transform: translateY(-8px);
    transition: opacity .35s var(--ease), transform .45s var(--ease), visibility 0s linear .45s;
  }
  .navbar.menu-open .mobile-menu { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .mobile-menu a {
    padding: 14px 2px; border-bottom: 1px solid var(--line);
    color: var(--navy); font-weight: 500; font-size: 1.05rem; text-decoration: none;
  }
  .mobile-menu a:last-child { border-bottom: 0; }
  .mobile-menu a[aria-current="true"], .mobile-menu a[aria-current="page"] { color: var(--gold-ink); }

  /* ---------- Giriş (hero): sakin bir liman ---------- */
  .hero {
    position: relative; isolation: isolate; overflow: hidden;
    min-height: 100vh; min-height: 100svh;
    display: grid; place-items: center; text-align: center; color: #fff;
    padding: calc(var(--nav-h) + 36px) 20px clamp(130px, 16vw, 190px);
    background:
      radial-gradient(60% 50% at 88% 6%, rgba(122, 162, 204, .2), transparent 70%),
      radial-gradient(55% 45% at 6% 94%, rgba(122, 162, 204, .14), transparent 70%),
      linear-gradient(170deg, #112640 0%, #183554 52%, #1F4467 100%);
  }
  /* Feneri andıran, yavaşça "nefes alan" ışık */
  .beacon {
    position: absolute; left: 50%; top: 42%; z-index: -1;
    width: min(1100px, 140vw); aspect-ratio: 1; pointer-events: none;
    transform: translate(-50%, -50%) scale(.92);
    background: radial-gradient(circle, rgba(225, 192, 130, .2) 0%, rgba(225, 192, 130, .07) 32%, transparent 62%);
    animation: breathe 10s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(.92); opacity: .75; }
    45% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; }
  }
  .hero-content { max-width: 880px; }
  .hero-kicker {
    font-family: var(--serif); font-style: italic; font-size: clamp(1.05rem, 1rem + .3vw, 1.2rem);
    color: var(--gold-soft); margin-bottom: 18px;
  }
  .hero h1 {
    color: #fff; font-size: clamp(2.2rem, 9vw, 4.4rem); line-height: 1.12;
    text-shadow: 0 2px 24px rgba(5, 15, 28, .25);
  }
  .hero-sub {
    max-width: 50ch; margin: 26px auto 40px;
    font-size: clamp(1.02rem, .98rem + .25vw, 1.15rem); font-weight: 300; line-height: 1.8;
    color: rgba(255, 255, 255, .86);
  }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .hero [data-hero] { opacity: 0; animation: rise 1.2s var(--ease) forwards; animation-delay: var(--d, 0s); }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 30px; border-radius: 999px; font-weight: 500; font-size: .98rem;
    text-decoration: none; white-space: nowrap;
    transition: transform .5s var(--ease), box-shadow .5s var(--ease), background-color .5s var(--ease), border-color .5s var(--ease);
  }
  .btn-gold { background: var(--gold); color: var(--sea-900); box-shadow: 0 14px 30px -14px rgba(201, 162, 94, .75); }
  .btn-gold:hover { background: #D5B06D; transform: translateY(-3px); box-shadow: 0 20px 36px -16px rgba(201, 162, 94, .85); }
  .btn-ghost { border: 1px solid rgba(255, 255, 255, .45); color: #fff; }
  .btn-ghost:hover { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .7); transform: translateY(-3px); }

  /* Yavaşça akan dalgalar; en alttaki katman bir sonraki bölümün rengiyle birleşir */
  .waves { position: absolute; left: 0; right: 0; bottom: -1px; height: clamp(72px, 10vw, 132px); overflow: hidden; pointer-events: none; }
  .wave { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; animation: drift linear infinite; }
  .wave--1 { fill: rgba(255, 255, 255, .06); animation-duration: 28s; }
  .wave--2 { fill: rgba(255, 255, 255, .11); animation-duration: 21s; animation-direction: reverse; }
  .wave--3 { fill: var(--mist); animation-duration: 36s; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ---------- Hakkımda ---------- */
  .about { background: var(--mist); }
  .about-grid {
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
    gap: clamp(48px, 7vw, 100px); align-items: center;
  }
  .portrait { position: relative; width: min(100%, 400px); margin: 0 auto; aspect-ratio: 483 / 647; }
  .portrait img, .portrait-frame {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border-radius: 50% 50% 24px 24px / 37.3% 37.3% 24px 24px;
  }
  .portrait img { z-index: 1; object-fit: cover; box-shadow: 0 30px 60px -30px rgba(19, 41, 63, .55); }
  .portrait-frame {
    border: 1.5px solid var(--gold); transform: translate(18px, 18px);
    transition: transform 1.4s var(--ease) .35s, opacity 1.4s var(--ease) .35s;
  }
  .js .portrait:not(.is-visible) .portrait-frame { transform: none; opacity: 0; }
  .portrait-badge {
    position: absolute; z-index: 2; left: -28px; bottom: 46px;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; border-radius: 18px;
    background: rgba(255, 255, 255, .92);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 18px 40px -22px rgba(19, 41, 63, .5);
  }
  .portrait-badge strong { font-family: var(--serif); font-size: 2rem; line-height: 1; color: var(--navy); font-weight: 600; }
  .portrait-badge span { font-size: .82rem; line-height: 1.35; color: var(--muted); max-width: 13ch; }

  .about-text h2 { font-size: clamp(2rem, 1.45rem + 2.2vw, 2.75rem); }
  .role { margin: 6px 0 26px; font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--gold-ink); }
  .about-text p:not(.role) { max-width: 60ch; margin-bottom: 18px; }
  .creds { list-style: none; margin-top: 32px; display: grid; gap: 18px; }
  .creds li { display: flex; gap: 16px; align-items: flex-start; }
  .creds .ic {
    flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%;
    background: var(--white); color: var(--navy); box-shadow: 0 0 0 1px var(--line);
  }
  .creds .ic .icon { width: 20px; height: 20px; }
  .creds strong { display: block; color: var(--navy); font-weight: 500; line-height: 1.45; }
  .creds small { display: block; color: var(--muted); font-size: .9rem; line-height: 1.5; }

  /* ---------- Çalışma alanları ---------- */
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 1000px; margin: 0 auto; }
  .card {
    position: relative; overflow: hidden;
    padding: 34px 28px 32px; border-radius: 22px;
    background: var(--mist); border: 1px solid transparent;
    transition: transform .6s var(--ease), box-shadow .6s var(--ease), background-color .6s var(--ease), border-color .6s var(--ease);
  }
  .card::after {
    content: ''; position: absolute; left: 28px; right: 28px; bottom: 0; height: 2px;
    background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .7s var(--ease);
  }
  .card:hover { transform: translateY(-6px); background: var(--white); border-color: var(--line); box-shadow: 0 28px 50px -32px rgba(19, 41, 63, .45); }
  .card:hover::after { transform: scaleX(1); }
  .card-icon {
    display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 24px;
    border-radius: 50%; background: var(--white); color: var(--navy);
    transition: background-color .6s var(--ease), color .6s var(--ease);
  }
  .card:hover .card-icon { background: var(--navy); color: #fff; }
  .card h3 { font-size: 1.24rem; margin-bottom: 12px; }
  .card p { font-size: .95rem; color: var(--muted); line-height: 1.7; }

  .topics { margin-top: clamp(56px, 7vw, 80px); text-align: center; }
  .topics h3 { font-size: 1.3rem; margin-bottom: 22px; }
  .chips { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 900px; margin: 0 auto; }
  .chips li {
    padding: 9px 18px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--white); color: var(--text); font-size: .92rem; line-height: 1.4;
  }

  /* ---------- Deneyim: zaman çizgisi ---------- */
  .experience { background: var(--mist); }
  .timeline {
    --date-w: 164px; --gap: 28px;
    position: relative; list-style: none; max-width: 860px; margin: 0 auto;
  }
  .timeline::before, .timeline::after {
    content: ''; position: absolute; top: 10px; bottom: 10px; width: 2px; border-radius: 2px;
    left: calc(var(--date-w) + var(--gap) - 1px);
  }
  .timeline::before { background: var(--line); }
  .timeline::after { background: var(--gold); transform-origin: top; transform: scaleY(var(--tl, 0)); }
  .tl-item {
    position: relative; display: grid; grid-template-columns: var(--date-w) minmax(0, 1fr);
    column-gap: calc(var(--gap) * 2); padding-bottom: 38px;
  }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before {
    content: ''; position: absolute; z-index: 1; top: 9px; left: calc(var(--date-w) + var(--gap) - 6px);
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--mist); border: 2px solid var(--gold);
    transition: background-color .8s var(--ease) .2s;
  }
  .tl-item.is-visible::before, html:not(.js) .tl-item::before { background: var(--gold); }
  .tl-date { text-align: right; font-size: .92rem; font-weight: 500; color: var(--gold-ink); padding-top: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tl-body h3 { font-size: 1.15rem; margin-bottom: 4px; }
  .tl-org { font-weight: 500; font-size: .95rem; color: var(--text); line-height: 1.55; }
  .tl-desc { margin-top: 6px; font-size: .94rem; color: var(--muted); line-height: 1.7; max-width: 62ch; }

  /* ---------- Akademik çalışmalar ---------- */
  .pub-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(20px, 3vw, 30px); }
  .pub {
    padding: clamp(26px, 3.4vw, 36px); border-radius: 22px;
    background: var(--mist); border-left: 3px solid var(--gold);
    transition: transform .6s var(--ease), box-shadow .6s var(--ease), background-color .6s var(--ease);
  }
  .pub:hover { transform: translateX(6px); background: var(--white); box-shadow: 0 26px 50px -32px rgba(19, 41, 63, .45); }
  .pub-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .pub-head .ic {
    flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
    background: var(--white); color: var(--gold-ink); box-shadow: 0 0 0 1px var(--line);
  }
  .pub-head .ic .icon { width: 21px; height: 21px; }
  .pub-head h3 { font-size: 1.2rem; }
  .pub-title { font-family: var(--serif); font-size: 1.06rem; line-height: 1.5; color: var(--navy); }
  .pub-meta { margin-top: 10px; font-size: .9rem; color: var(--muted); line-height: 1.65; }
  .pub-link {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 14px;
    font-size: .92rem; font-weight: 500; color: var(--navy);
    text-decoration: underline; text-decoration-color: rgba(201, 162, 94, .7);
    text-underline-offset: 5px; text-decoration-thickness: 1.5px;
    transition: text-decoration-color .4s var(--ease);
  }
  .pub-link:hover { text-decoration-color: var(--navy); }
  .pub-link .icon { width: 15px; height: 15px; }
  .pub-list { list-style: none; display: grid; gap: 12px; }
  .pub-list li { position: relative; padding-left: 18px; font-size: .94rem; line-height: 1.6; }
  .pub-list li::before { content: ''; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
  .pub-list .yr { color: var(--gold-ink); font-weight: 500; }
  .pub-list em { display: block; color: var(--muted); font-size: .9rem; }
  .pub p + p { margin-top: 12px; }
  .pub > p { font-size: .94rem; line-height: 1.7; }
  .pub--wide { grid-column: 1 / -1; }
  .pub--wide > p { max-width: 72ch; }
  /* ---------- Yazılarım sayfası: sakin, yumuşak ve ters renkler ---------- */
  .subpage {
    --sp-paper: #EEF2F5;      /* yumuşak beyaz: üst bölüm ve alt bilgi */
    --sp-ink: #2D4258;        /* yumuşak lacivert: okuma alanı */
    --sp-ink-text: #E6ECF1;   /* okuma alanındaki yazı */
    --sp-ink-muted: #B7C4D0;
    --sp-paper-text: #4A5D70;
  }
  body.subpage { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  body.subpage main { flex: 1; display: flex; flex-direction: column; }
  .subpage .navbar.scrolled { background: rgba(238, 242, 245, .95); box-shadow: 0 1px 0 rgba(45, 66, 88, .1); }
  .page-head {
    background: var(--sp-paper); text-align: center;
    padding: calc(66px + clamp(52px, 7vw, 88px)) 0 clamp(46px, 6vw, 68px);
  }
  .page-head h1 { color: var(--sp-ink); font-size: clamp(2.3rem, 6vw, 3.4rem); line-height: 1.12; }
  .page-head h1::after {
    content: ''; display: block; width: 56px; height: 2px; margin: 20px auto 0; background: var(--gold);
  }
  .writing {
    flex: 1; background: var(--sp-ink); color: var(--sp-ink-text);
    padding: clamp(48px, 7vw, 84px) 0 clamp(64px, 9vw, 104px);
  }
  .posts { max-width: 760px; margin: 0 auto; }
  .back-home { text-align: center; }
  .back-home a {
    display: inline-flex; align-items: center; gap: 8px; color: var(--sp-ink-text); font-weight: 500;
    text-decoration: underline; text-underline-offset: 5px; text-decoration-color: rgba(229, 205, 156, .7);
    transition: text-decoration-color .4s var(--ease);
  }
  .back-home a:hover { text-decoration-color: var(--sp-ink-text); }
  .back-home .icon { width: 17px; height: 17px; color: var(--gold-soft); }
  .subpage footer { background: var(--sp-paper); color: var(--sp-paper-text); }
  .subpage .footer-social a { color: var(--sp-ink); }
  .subpage .footer-social a:hover { color: var(--gold-ink); }
  .train-list { display: block; columns: 2; column-gap: clamp(28px, 4vw, 52px); }
  .train-list li { break-inside: avoid; margin-bottom: 14px; }
  .train-list .t-name { display: block; color: var(--text); font-weight: 500; }
  .train-list .t-org { display: block; color: var(--muted); font-size: .88rem; line-height: 1.55; margin-top: 2px; }
  @media (max-width: 760px) { .train-list { columns: 1; } }

  /* ---------- İletişim ---------- */
  .contact {
    position: relative; isolation: isolate; overflow: hidden; color: #fff;
    padding-top: calc(clamp(84px, 11vw, 136px) + clamp(40px, 6vw, 70px));
    background:
      radial-gradient(50% 60% at 50% 55%, rgba(225, 192, 130, .1), transparent 70%),
      radial-gradient(50% 50% at 92% 90%, rgba(122, 162, 204, .16), transparent 70%),
      linear-gradient(170deg, #1F4467 0%, #183554 45%, #112640 100%);
  }
  .contact-wave {
    position: absolute; top: -1px; left: 0; width: 100%; height: clamp(46px, 6vw, 84px);
    transform: scaleY(-1); fill: var(--white); pointer-events: none;
  }
  .contact .section-head h2 { color: #fff; }
  .contact .lead { color: rgba(255, 255, 255, .82); }
  .contact-card {
    max-width: 960px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.35fr); gap: 18px;
    padding: clamp(26px, 4.5vw, 46px); border-radius: 28px;
    background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .16);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 40px 80px -40px rgba(5, 15, 28, .6);
  }
  .info {
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
    padding: 12px 8px; border-radius: 18px; text-decoration: none; color: #fff;
  }
  .info-icon {
    flex: none; display: grid; place-items: center; width: 58px; height: 58px; margin-bottom: 6px;
    border-radius: 50%; background: var(--gold); color: var(--sea-900);
    transition: transform .6s var(--ease);
  }
  a.info:hover .info-icon { transform: scale(1.08); }
  .info-text { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .info-label { font-family: var(--serif); font-size: 1.15rem; }
  .info-value { color: rgba(255, 255, 255, .82); font-size: .98rem; overflow-wrap: anywhere; }
  .info-sub { color: var(--gold-soft); font-size: .86rem; }
  .social { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
  .social-link {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .32); color: #fff; text-decoration: none; font-weight: 500; font-size: .95rem;
    transition: background-color .5s var(--ease), border-color .5s var(--ease), transform .5s var(--ease);
  }
  .social-link .icon { width: 16px; height: 16px; color: var(--gold-soft); }
  .social-link:hover { background: rgba(255, 255, 255, .08); border-color: var(--gold); transform: translateY(-2px); }
  a.info:hover .info-value { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(229, 205, 156, .8); }
  .note {
    margin: 30px auto 0; max-width: 60ch; text-align: center;
    font-size: .9rem; color: rgba(255, 255, 255, .72);
  }
  .note .icon { display: inline-block; vertical-align: -4px; margin-right: 8px; width: 18px; height: 18px; color: var(--gold-soft); }

  footer { background: var(--sea-900); color: rgba(255, 255, 255, .62); padding: 26px 0; font-size: .88rem; }
  .footer-inner {
    max-width: 1160px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 28px;
  }
  .footer-social { display: flex; gap: 22px; }
  .footer-social a { color: rgba(255, 255, 255, .78); text-decoration: none; transition: color .4s var(--ease); }
  .footer-social a:hover { color: var(--gold-soft); text-decoration: underline; text-underline-offset: 4px; }

  /* ---------- Kaydırınca beliren içerik ---------- */
  .js [data-reveal]:not(.is-visible) { opacity: 0; }
  .js [data-reveal].is-visible { animation: reveal-up 1.1s var(--ease) var(--d, 0s) backwards; }
  .js [data-reveal="left"].is-visible { animation-name: reveal-left; }
  .js [data-reveal="right"].is-visible { animation-name: reveal-right; }
  .js [data-reveal="zoom"].is-visible { animation-name: reveal-zoom; }
  @keyframes reveal-up { from { opacity: 0; transform: translateY(22px); } }
  @keyframes reveal-left { from { opacity: 0; transform: translateX(-26px); } }
  @keyframes reveal-right { from { opacity: 0; transform: translateX(26px); } }
  @keyframes reveal-zoom { from { opacity: 0; transform: scale(.97); } }

  /* Dil değişirken metin yumuşakça solup geri gelir */
  main, footer, .nav-links, .mobile-menu a, .skip-link { transition: opacity .25s ease; }
  html.lang-fade main, html.lang-fade footer, html.lang-fade .nav-links, html.lang-fade .mobile-menu a { opacity: 0; }

  /* ---------- Duyarlı yerleşim ---------- */
  @media (max-width: 980px) {
    .nav-links { display: none; }
    .menu-toggle { display: inline-block; }
    .logo { font-size: 1.25rem; }
    .nav-inner { gap: 14px; }
  }
  @media (min-width: 981px) {
    .mobile-menu { display: none; }
  }
  @media (max-width: 900px) {
    .about-grid { grid-template-columns: minmax(0, 1fr); }
    .portrait { width: min(100%, 360px); }
    .pub-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    .contact-card { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 10px 18px; }
    .info-value { font-size: .92rem; }
    .info { flex-direction: row; align-items: center; gap: 16px; text-align: left; padding: 18px 0; border-radius: 0; }
    .info + .info { border-top: 1px solid rgba(255, 255, 255, .12); }
    .info-icon { width: 48px; height: 48px; margin-bottom: 0; }
    .info-icon .icon { width: 21px; height: 21px; }
    .info-text { align-items: flex-start; gap: 2px; min-width: 0; }
  }
  @media (max-width: 720px) {
    .timeline { --date-w: 0px; --gap: 0px; }
    .timeline::before, .timeline::after { left: 5px; }
    .tl-item { grid-template-columns: minmax(0, 1fr); padding-left: 34px; }
    .tl-item::before { left: 0; top: 7px; }
    .tl-date { text-align: left; padding: 0 0 4px; }
  }
  @media (max-width: 620px) {
    .cards { grid-template-columns: minmax(0, 1fr); }
    .footer-inner { justify-content: center; text-align: center; }
    .portrait-badge { left: 12px; bottom: 22px; }
    .portrait-frame { transform: translate(12px, 12px); }
    .hero-actions .btn { width: 100%; max-width: 320px; }
  }
  @media (max-width: 420px) {
    .nav-inner { padding: 0 14px; gap: 10px; }
    .nav-actions { gap: 8px; }
    .logo { font-size: 1.1rem; }
    .lang-switch { width: 72px; height: 34px; }
    .menu-toggle { width: 40px; height: 40px; }
    .menu-toggle span:nth-child(1) { top: 13px; }
    .menu-toggle span:nth-child(2) { top: 19px; }
    .menu-toggle span:nth-child(3) { top: 25px; }
  }
  @media (max-width: 340px) {
    .logo { font-size: 1rem; }
    .social { gap: 10px; }
    .social-link { padding: 9px 14px; gap: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important;
      transition-duration: .001ms !important; transition-delay: 0s !important;
    }
    .hero [data-hero], .js [data-reveal] { opacity: 1 !important; animation: none !important; }
  }
</style>

</head>
<body class="subpage">
<div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

<header class="navbar" id="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">Ceylan Hasanoğlu</a>

    <nav class="nav-links" aria-label="Ana menü" data-en-aria-label="Main menu">
      <a href="index.html#hakkimda" data-en="About">Hakkımda</a>
      <a href="index.html#calisma-alanlari" data-en="Areas of Practice">Çalışma Alanları</a>

      <a href="yazilar.html" aria-current="page" data-en="Articles">Yazılarım</a>
      <a href="index.html#iletisim" data-en="Contact">İletişim</a>
    </nav>

    <div class="nav-actions">
      <button class="lang-switch" id="langSwitch" type="button" role="switch" aria-checked="false"
              aria-label="English" title="Türkçe / English">
        <span class="lang-switch__thumb" aria-hidden="true"></span>
        <span class="lang-switch__opt" data-opt="tr" aria-hidden="true">TR</span>
        <span class="lang-switch__opt" data-opt="en" aria-hidden="true">EN</span>
      </button>
      <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="mobileMenu"
              aria-label="Menü" data-en-aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <nav class="mobile-menu" id="mobileMenu" aria-label="Mobil menü" data-en-aria-label="Mobile menu">
    <a href="index.html#hakkimda" data-en="About">Hakkımda</a>
    <a href="index.html#calisma-alanlari" data-en="Areas of Practice">Çalışma Alanları</a>
    <a href="index.html#deneyim" data-en="Experience">Deneyim</a>
    <a href="index.html#akademik" data-en="Research">Akademik</a>
    <a href="yazilar.html" aria-current="page" data-en="Articles">Yazılarım</a>
    <a href="index.html#iletisim" data-en="Contact">İletişim</a>
  </nav>
</header>

<main id="main">

  <!-- ===== Sayfa başlığı ===== -->
  <section class="page-head">
    <div class="container">
      <h1 data-en="Articles">Yazılarım</h1>
    </div>
  </section>

  <!-- ===== Yazı listesi =====
       Yazılar geldikçe en yenisi en üstte olacak şekilde buraya eklenecek.
       Her yazının kendi sayfası olacak; buradaki kart o sayfaya gidecek. -->
  <section class="writing">
    <div class="container">
      <div class="posts"></div>
      <p class="back-home">
        <a href="index.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span data-en="Back to the home page">Ana sayfaya dönün</span></a>
      </p>
    </div>
  </section>

</main>

<footer>
  <div class="footer-inner">
    <p>© <span id="year">2026</span> Ceylan Hasanoğlu. <span data-en="All rights reserved.">Tüm hakları saklıdır.</span></p>
    <nav class="footer-social" aria-label="Sosyal medya" data-en-aria-label="Social media">
      <a href="https://www.linkedin.com/in/ceylanhasanoglu" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://www.instagram.com/ceylanhasanoglu.psk/" target="_blank" rel="noopener">Instagram</a>
    </nav>
  </div>
</footer>

<script>
(function () {
  'use strict';
  var html = document.documentElement;
  var navbar = document.getElementById('navbar');
  var bar = document.getElementById('progressBar');
  var timeline = document.getElementById('timeline');
  var solidNav = document.body.classList.contains('subpage');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  window.__siteReady = true;

  /* ---- Kaydırma: üst menü görünümü, ilerleme çizgisi, zaman çizgisi ---- */
  var ticking = false;
  function onScroll() {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }
  function update() {
    ticking = false;
    var y = window.scrollY || window.pageYOffset;
    navbar.classList.toggle('scrolled', solidNav || y > 40);
    var max = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, y / max) : 0) + ')';
    if (timeline) {
      var r = timeline.getBoundingClientRect();
      var p = (window.innerHeight * 0.62 - r.top) / r.height;
      timeline.style.setProperty('--tl', Math.max(0, Math.min(1, p)).toFixed(4));
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();

  /* ---- Kaydırınca beliren içerik ---- */
  var revealEls = document.querySelectorAll('[data-reveal]');
  if ('IntersectionObserver' in window && !reduceMotion.matches) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
    revealEls.forEach(function (el) { io.observe(el); });
  } else {
    revealEls.forEach(function (el) { el.classList.add('is-visible'); });
  }

  /* ---- Menüde bulunulan bölümü işaretle ---- */
  var navAnchors = document.querySelectorAll('.nav-links a, .mobile-menu a');
  function setActive(id) {
    navAnchors.forEach(function (a) {
      if (id && a.getAttribute('href') === '#' + id) a.setAttribute('aria-current', 'true');
      else a.removeAttribute('aria-current');
    });
  }
  if ('IntersectionObserver' in window) {
    var spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) setActive(e.target.id === 'top' ? null : e.target.id);
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    ['top', 'hakkimda', 'calisma-alanlari', 'deneyim', 'akademik', 'iletisim'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) spy.observe(el);
    });
  }

  /* ---- Mobil menü ---- */
  var menuBtn = document.getElementById('menuToggle');
  var menu = document.getElementById('mobileMenu');
  function setMenu(open) {
    menuBtn.setAttribute('aria-expanded', String(open));
    navbar.classList.toggle('menu-open', open);
  }
  menuBtn.addEventListener('click', function () {
    setMenu(menuBtn.getAttribute('aria-expanded') !== 'true');
  });
  menu.addEventListener('click', function (e) { if (e.target.closest('a')) setMenu(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && navbar.classList.contains('menu-open')) { setMenu(false); menuBtn.focus(); }
  });
  document.addEventListener('click', function (e) {
    if (navbar.classList.contains('menu-open') && !navbar.contains(e.target)) setMenu(false);
  });
  window.addEventListener('resize', function () { if (window.innerWidth > 980) setMenu(false); });

  /* ---- Dil: Türkçe metin elementte, İngilizcesi data-en özniteliğinde ---- */
  var sw = document.getElementById('langSwitch');
  var ATTRS = ['aria-label', 'alt', 'content'];
  var current = 'tr';

  function swapText(lang) {
    document.querySelectorAll('[data-en]').forEach(function (el) {
      if (el.__tr === undefined) el.__tr = el.innerHTML;
      el.innerHTML = lang === 'en' ? el.getAttribute('data-en') : el.__tr;
    });
    ATTRS.forEach(function (attr) {
      document.querySelectorAll('[data-en-' + attr + ']').forEach(function (el) {
        var key = '__tr_' + attr;
        if (el[key] === undefined) el[key] = el.getAttribute(attr) || '';
        el.setAttribute(attr, lang === 'en' ? el.getAttribute('data-en-' + attr) : el[key]);
      });
    });
    html.lang = lang;
  }

  function applyLang(lang, animate) {
    if (lang === current) return;
    current = lang;
    sw.setAttribute('aria-checked', String(lang === 'en'));
    try { localStorage.setItem('ch-lang', lang); } catch (e) {}
    if (animate && !reduceMotion.matches) {
      html.classList.add('lang-fade');
      setTimeout(function () {
        swapText(lang);
        requestAnimationFrame(function () { html.classList.remove('lang-fade'); });
      }, 250);
    } else {
      swapText(lang);
    }
  }

  // Anahtar: tıklama, klavye (← →) ve parmakla kaydırma
  var drag = null, suppressClick = false;
  sw.addEventListener('click', function (e) {
    if (suppressClick) { suppressClick = false; return; }
    var opt = e.target.closest && e.target.closest('[data-opt]');
    applyLang(opt ? opt.getAttribute('data-opt') : (current === 'tr' ? 'en' : 'tr'), true);
  });
  sw.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); applyLang('en', true); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); applyLang('tr', true); }
  });
  sw.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, moved: false }; });
  window.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x;
    if (Math.abs(dx) > 14) {
      drag.moved = true;
      drag.x = e.clientX;
      applyLang(dx > 0 ? 'en' : 'tr', true);
    }
  });
  window.addEventListener('pointerup', function () {
    if (drag && drag.moved) {
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 60);
    }
    drag = null;
  });

  // Başlangıç dili: adres çubuğundaki ?lang=en, sonra önceki seçim, yoksa Türkçe
  var initial = 'tr';
  try {
    var param = new URLSearchParams(location.search).get('lang');
    var saved = localStorage.getItem('ch-lang');
    if (param === 'en' || param === 'tr') initial = param;
    else if (saved === 'en' || saved === 'tr') initial = saved;
  } catch (e) {}
  applyLang(initial, false);
  html.classList.remove('i18n-wait');

  var yearEl = document.getElementById('year');
  if (yearEl) yearEl.textContent = String(Math.max(2026, new Date().getFullYear()));
})();
</script>
